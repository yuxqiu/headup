[package]
name = "headup"
version = "0.4.2"
edition = "2024"
description = "Gentle reminders to lift your head, using the motion sensors in your earbuds"
license = "MIT"
repository = "https://github.com/yuxqiu/headup"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
notify-rust = { version = "4.18.2", default-features = false, features = ["z-with-tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "signal", "io-util", "sync"] }

# On Linux, play through PulseAudio's protocol (PipeWire serves it too), so cues reach the default
# output. Without a PulseAudio server cpal falls back to ALSA.
[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17.4", default-features = false, features = ["bluetoothd", "rfcomm"] }
cpal = { version = "0.18.2", features = ["pulseaudio"] }

[dev-dependencies]
csv = "1.4.0"
tokio = { version = "1.54.1", features = ["test-util", "macros", "rt"] }
